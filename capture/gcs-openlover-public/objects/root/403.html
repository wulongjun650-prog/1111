<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>暂时无法访问</title>
    <style>
      :root {
        color-scheme: dark;
        --page-background: #0a0809;
        --surface: #121212;
        --text-primary: #ffffff;
        --text-secondary: #e5e5e5;
        --border: rgb(255 255 255 / 12%);
        --border-accent: rgb(245 86 164 / 28%);
        --accent-start: #f56eb1;
        --accent-end: #f556a4;
        --accent-hover-start: #f53d98;
        --accent-hover-end: #f5258b;
        --accent-soft: rgb(245 86 164 / 12%);
        --focus-ring: rgb(245 110 177 / 28%);
        --shadow: rgb(0 0 0 / 24%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100dvh;
        place-items: center;
        padding: 24px;
        background: var(--page-background);
        color: var(--text-primary);
        font-family:
          Inter, "Roboto Mono", system-ui, -apple-system, BlinkMacSystemFont,
          sans-serif;
        letter-spacing: 0;
      }

      main {
        width: min(100%, 420px);
        padding: 40px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        box-shadow: 0 10px 30px var(--shadow);
        text-align: center;
      }

      .status-icon {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        place-items: center;
        border: 1px solid var(--border-accent);
        border-radius: 50%;
        background: var(--accent-soft);
        color: var(--accent-end);
      }

      .status-symbol {
        font-size: 28px;
        font-weight: 500;
        line-height: 1;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.3;
        letter-spacing: 0;
      }

      p {
        margin: 12px 0 28px;
        color: var(--text-secondary);
        font-size: 15px;
        line-height: 1.7;
      }

      button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 20px;
        border: 0;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--accent-start), var(--accent-end));
        color: var(--text-primary);
        cursor: pointer;
        font: inherit;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: 0;
        transition: transform 160ms ease;
      }

      button:hover {
        background: linear-gradient(
          90deg,
          var(--accent-hover-start),
          var(--accent-hover-end)
        );
      }

      button:active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .refresh-symbol {
        font-size: 19px;
        font-weight: 500;
        line-height: 1;
      }

      @media (max-width: 480px) {
        body {
          padding: 16px;
        }

        main {
          padding: 32px 24px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="status-icon" aria-hidden="true">
        <span class="status-symbol">!</span>
      </div>
      <h1>暂时无法访问</h1>
      <p>安全系统暂时拦截了此次访问。请稍后刷新页面重试。</p>
      <button id="retry-button" type="button">
        <span class="refresh-symbol" aria-hidden="true">↻</span>
        <span>刷新页面</span>
      </button>
    </main>

    <script>
      const retryButton = document.getElementById('retry-button')
      const previousPage = document.referrer

      retryButton.addEventListener('click', () => {
        if (previousPage && previousPage !== window.location.href) {
          window.location.assign(previousPage)
          return
        }

        window.location.reload()
      })
    </script>
  </body>
</html>
